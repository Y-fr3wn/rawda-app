name: Build Rawda 1.4.3 Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rawda-1-4-3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: 'true'
      BOT: 'true'
      HAS_RELEASE_KEY: ${{ secrets.RAWDA_KEYSTORE_BASE64 != '' && secrets.RAWDA_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Rawda 1.4.3 Flutter project
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part-*.b64 | base64 --decode > /tmp/rawda-source.zip
          echo 'ee84f3153a14e9dfe871e8dd206f130907c04046aea79c37b2b45bebb31120e4  /tmp/rawda-source.zip' | sha256sum --check
          unzip -q /tmp/rawda-source.zip
          cp rawda/android/app/src/main/res/raw/adhan.ogg rawda/assets/adhan.ogg
          cp rawda/android/app/src/main/res/raw/iqama.ogg rawda/assets/iqama.ogg
          test -f rawda/lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Check Egypt time transitions
        working-directory: rawda
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Restore Flutter dependencies
        working-directory: rawda
        run: flutter pub get --enforce-lockfile
      - name: Check Flutter source
        working-directory: rawda
        run: |
          dart format lib test
          flutter analyze
          flutter test --reporter expanded
      - name: Check native Android notification tests
        working-directory: rawda
        run: ./android/gradlew -p android :app:testDebugUnitTest --no-daemon
      - name: Build Firebase debug APK
        working-directory: rawda
        run: flutter build apk --debug --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.3-TEST-APK
          path: rawda/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Restore private release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.RAWDA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > rawda/android/rawda-release.jks
      - name: Build signed release APK and AAB
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: rawda
        env:
          RAWDA_KEYSTORE_PASSWORD: ${{ secrets.RAWDA_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
          flutter build appbundle --release --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
      - name: Upload signed APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.3-SIGNED-APK
          path: rawda/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed AAB
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.3-SIGNED-AAB
          path: rawda/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing key
        if: always()
        run: rm -f rawda/android/rawda-release.jks
