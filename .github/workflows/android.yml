name: Build Rawda redesigned Android
on:
  workflow_dispatch:
  push:
    branches: [main, feature/nusuk-inspired-ui]
permissions:
  contents: read
concurrency:
  group: rawda-1-4-5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: 'true'
      BOT: 'true'
      HAS_RELEASE_KEY: ${{ secrets.RAWDA_KEYSTORE_BASE64 != '' && secrets.RAWDA_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Rawda base and apply 1.4.4 visual redesign
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part-*.b64 | base64 --decode > /tmp/rawda-source.zip
          echo 'ee84f3153a14e9dfe871e8dd206f130907c04046aea79c37b2b45bebb31120e4  /tmp/rawda-source.zip' | sha256sum --check
          unzip -q /tmp/rawda-source.zip
          git apply --check overrides/visual-redesign.patch
          git apply overrides/visual-redesign.patch
          base64 --decode overrides/madinah_hero.b64 > rawda/assets/madinah_hero.jpg
          echo '2b1c1939dd62182301c667c4c516b759ff86849b1fcefaafaec6c408f1d71d86  rawda/assets/madinah_hero.jpg' | sha256sum --check
          cp rawda/android/app/src/main/res/raw/adhan.ogg rawda/assets/adhan.ogg
          cp rawda/android/app/src/main/res/raw/iqama.ogg rawda/assets/iqama.ogg
          test -f rawda/lib/main.dart
          if [ -d editable/lib ]; then
            cp -R editable/lib/. rawda/lib/
            rm -rf rawda/lib/lib
            echo 'Applied redesigned Rawda Flutter UI from editable/lib.'
          fi
          if [ -f editable/test/app_test.dart ]; then
            cp editable/test/app_test.dart rawda/test/app_test.dart
            echo 'Using updated visual navigation regression test.'
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
          else
            echo 'SDK Manager is not installed on runner; Android Gradle plugin can download necessary components during build.'
          fi
      - name: Check Egypt time transitions
        working-directory: rawda
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Restore Flutter dependencies
        working-directory: rawda
        run: flutter pub get --enforce-lockfile
      - name: Check Flutter source
        working-directory: rawda
        run: |
          dart format lib test
          flutter analyze
          flutter test --reporter expanded
      - name: Check native Android notification tests
        working-directory: rawda
        run: bash android/gradlew -p android :app:testDebugUnitTest --no-daemon
      - name: Build Firebase debug APK
        working-directory: rawda
        run: flutter build apk --debug --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
      - name: Build optimized profile APK (AOT for smoother UI)
        working-directory: rawda
        run: flutter build apk --profile --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
      - name: Upload optimized installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.5-FAST-APK
          path: rawda/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-Nusuk-UI-TEST-APK
          path: rawda/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Restore private release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.RAWDA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > rawda/android/rawda-release.jks
      - name: Build signed release APK and AAB
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: rawda
        env:
          RAWDA_KEYSTORE_PASSWORD: ${{ secrets.RAWDA_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
          flutter build appbundle --release --no-pub --dart-define=RAWDA_USE_FIREBASE=true --dart-define=RAWDA_FIREBASE_EMAIL_RETURN=true
      - name: Upload signed APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.5-SIGNED-APK
          path: rawda/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed AAB
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.5-SIGNED-AAB
          path: rawda/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rawda-1.4.5-UI-Screenshots
          path: rawda/test-results/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove private signing key
        if: always()
        run: rm -f rawda/android/rawda-release.jks
